name: OpenFront Switch

on:
  push:
    paths:
      - "openfront-switch/**"
      - ".github/workflows/openfront-switch.yml"
  pull_request:
    paths:
      - "openfront-switch/**"
      - ".github/workflows/openfront-switch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openfront-switch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch OpenFront, QuickJS-ng, cJSON and fonts
        run: ./scripts/fetch-deps.sh

      - name: Build romfs (engine bundle, maps, languages, icons, fonts)
        run: ./scripts/build-romfs.sh

      - name: Smoke test the engine bundle
        run: node scripts/node-host.mjs romfs/engine.js romfs britannia 300

      - name: Build and run the desktop version (menu and a game screen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev zlib1g-dev
          cmake -S . -B build/desktop
          cmake --build build/desktop -j"$(nproc)"
          SDL_VIDEODRIVER=dummy ./build/desktop/openfront --autoplay faroeislands \
            --frames 900 --scene radial --screenshot radial.bmp

      - name: Build openfront.nro (devkitA64)
        run: ./scripts/build-switch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openfront-switch
          path: openfront-switch/openfront.nro
          if-no-files-found: error
